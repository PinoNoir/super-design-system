name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # npm trusted publishing (OIDC) needs npm >=11.5.1, which can lag
      # behind whatever a given Node release bundles. Pinned to the 11.x
      # line rather than `latest`: npm 12 made a breaking config-schema
      # change (verified locally) that broke both this repo's own .npmrc
      # settings and a --no-git-checks flag @changesets/cli relies on.
      - name: Ensure npm is new enough for trusted publishing
        run: npm install -g npm@^11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # If there are pending changesets on main, this opens/updates a
      # "Version Packages" PR (version bump + changelogs, no publish yet).
      # If that PR has just been merged (no pending changesets, versions
      # ahead of what's on npm), this runs `publish` instead, which
      # publishes via npm's trusted publishing (OIDC) - no NPM_TOKEN needed,
      # as long as each package's Trusted Publisher on npmjs.com is
      # configured to trust this exact workflow file.
      #
      # Pinned to the v1 line (input names: publish/version/commit/title,
      # not the kebab-case publish-script/version-script/etc.) because this
      # repo's @changesets/cli is v2.x; changesets/action@v2 requires CLI v3.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
